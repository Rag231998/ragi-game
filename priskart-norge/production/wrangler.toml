name = "priskart-norge"
main = "./worker.js"
compatibility_date = "2026-10-20"
workers_dev = true

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Must be replaced with the real D1 database UUID returned by Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "priskart-norge"
database_id = "REPLACE_WITH_REAL_CLOUDFLARE_D1_ID"

# Secrets, not checked into git:
# TURNSTILE_SITE_KEY (public site key; var), TURNSTILE_SECRET (secret),
# RATE_SECRET (32+ random chars; secret).
