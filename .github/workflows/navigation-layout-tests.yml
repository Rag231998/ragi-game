name: Navigation and layout regression checks
on:
  push:
    branches: [main]
    paths:
      - 'lanesjekk-norge/tests/navigation-search.spec.cjs'
      - 'lanesjekk-norge/site-search.js'
      - 'lanesjekk-norge/site-search.css'
      - 'lanesjekk-norge/contrast-fix.css'
      - 'lanesjekk-norge/single-page.js'
      - 'lanesjekk-norge/index.html'
      - '.github/workflows/navigation-layout-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: lanesjekk-norge/tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test site search, page tabs, contrast and responsive layout
        run: npx playwright test navigation-search.spec.cjs --project=desktop-chromium --project=android-chromium --workers=2 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: navigation-layout-playwright
          path: |
            lanesjekk-norge/tests/playwright-report
            lanesjekk-norge/tests/test-results
          retention-days: 3
