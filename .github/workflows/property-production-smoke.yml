name: Property production smoke test
on:
  push:
    branches: [main]
    paths:
      - 'lanesjekk-norge/tests/property-production-smoke.cjs'
      - '.github/workflows/property-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check production address suggestions, housing prices, and website
        run: node lanesjekk-norge/tests/property-production-smoke.cjs
