name: Property market live source verification
on:
  push:
    branches: [main]
    paths:
      - 'lanesjekk-norge/api/property-market.js'
      - 'lanesjekk-norge/tests/property-market-live.cjs'
      - '.github/workflows/property-market-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify live SSB source through our API handler
        run: node lanesjekk-norge/tests/property-market-live.cjs
