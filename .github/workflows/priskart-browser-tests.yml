name: PrisKart browser and mobile tests
on:
  push:
    branches: [main]
    paths:
      - 'priskart-norge/site/**'
      - 'priskart-norge/tests/**'
      - '.github/workflows/priskart-browser-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 1'
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: priskart-norge/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priskart-browser-results
          path: |
            priskart-norge/tests/playwright-report
            priskart-norge/tests/test-results
          retention-days: 7
