name: Property UI focused browser smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/property-ui-smoke.yml'
      - 'lanesjekk-norge/tests/property.spec.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: lanesjekk-norge/tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test property valuation autocomplete and mobile
        run: npx playwright test property.spec.cjs --project=desktop-chromium --project=android-chromium --workers=2 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: property-ui-browser-report
          path: |
            lanesjekk-norge/tests/playwright-report
            lanesjekk-norge/tests/test-results
          retention-days: 3
