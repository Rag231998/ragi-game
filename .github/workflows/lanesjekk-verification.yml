name: Lanesjekk verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lanesjekk-norge/**'
      - '.github/workflows/lanesjekk-verification.yml'
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in lanesjekk-norge/*.js; do node --check "$file"; done
      - name: Run all Lånesjekk application tests before browser setup
        working-directory: lanesjekk-norge
        run: npm test
      - name: Install browser tests
        working-directory: lanesjekk-norge/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run receipt and navigation browser tests
        working-directory: lanesjekk-norge/tests
        env:
          CI: 'true'
        run: npx playwright test receipts.spec.cjs --project=desktop-chromium --project=android-chromium
