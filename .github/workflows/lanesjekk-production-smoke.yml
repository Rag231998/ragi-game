name: Lånesjekk production smoke
on:
  push:
    branches: [main]
    paths:
      - 'lanesjekk-norge/tests/production-smoke.cjs'
      - '.github/workflows/lanesjekk-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public website, bank search files and actual API POST
        env:
          LANESJEKK_URL: https://lanesjekk-norge.vercel.app
        run: node lanesjekk-norge/tests/production-smoke.cjs
