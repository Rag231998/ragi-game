<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#10273c">
<title>Full forhåndsvisning · Lånesjekk Studio</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:#163a49;background:#edf3f5}
header{min-height:76px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:14px clamp(15px,3vw,35px);background:#122d40;color:white;box-shadow:0 4px 22px #10263733}
.brand{font-size:17px;font-weight:850;letter-spacing:-.03em}
.brand small{display:block;color:#9ac2cd;font-size:10px;letter-spacing:.09em;margin-top:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;font-size:12px;font-weight:720;border-radius:9px;min-height:36px;padding:7px 12px;cursor:pointer}
button{border:1px solid #4b7e87;background:#234659;color:white}
button[aria-pressed="true"]{background:#78d8bb;color:#103d3d;border-color:#78d8bb}
button:focus-visible,select:focus-visible{outline:3px solid #51d6b9;outline-offset:3px}
select{border:1px solid #d3e5e8;color:#14394b;background:white;max-width:min(280px,90vw)}
.subbar{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;background:white;border-bottom:1px solid #dbe6eb;padding:9px clamp(15px,3vw,35px);color:#55727c;font-size:12px}
#preview-state{font-weight:850;color:#127f6a}
#preview-state[data-error="true"]{color:#ad493e}
.stage{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding:18px;min-height:calc(100dvh - 130px)}
#site-frame{display:block;width:100%;height:calc(100dvh - 174px);min-height:580px;border:1px solid #bbd0d8;background:white;border-radius:13px;box-shadow:0 12px 48px #11354c20;transition:width .16s ease}
.stage.mobile #site-frame{width:min(390px,100%);height:calc(100dvh - 174px)}
.stage.tablet #site-frame{width:min(820px,100%)}
.stage.desktop{padding:0}
.stage.desktop #site-frame{border-radius:0;border:none;height:calc(100dvh - 132px);min-height:580px}
body:fullscreen{background:#0d2032}
body:fullscreen .stage{height:calc(100dvh - 125px);min-height:0}
body:fullscreen .stage #site-frame{height:100%;min-height:0}
body:fullscreen .subbar{padding:8px 24px}
body:fullscreen header{min-height:58px;padding:8px 24px}
body:fullscreen .stage.desktop #site-frame{height:100%}
body:fullscreen .stage.mobile,body:fullscreen .stage.tablet{padding:10px}
@media(max-width:660px){header{padding:12px}.subbar{padding:10px 12px}.stage{padding:8px}select{width:180px}}
@media(prefers-reduced-motion:reduce){#site-frame{transition:none}}
</style>
</head>
<body>
<header>
 <div class="brand">◈ LÅNESJEKK <span style="color:#7fe4c7">STUDIO</span><small>FORHÅNDSVISNING · IKKE PUBLISERT</small></div>
 <div class="toolbar">
  <label for="preview-section" style="font-size:12px">Gå til</label>
  <select id="preview-section" aria-label="Gå til side eller objekt">
   <option value="topp">Forside</option><option value="sjekk">Boliglån</option><option value="billan">Billån</option><option value="forbrukslan">Forbrukslån</option><option value="banker">Banker</option><option value="budsjett">Budsjett</option><option value="kvitteringer">Kvitteringer</option><option value="sparing">Sparing</option><option value="investering">Fond og aksjer</option><option value="valutakompass">Valuta</option><option value="boligverdi">Boligverdi</option><option value="utleieanalyse">Utleie</option><option value="akademi">Akademiet</option><option value="guider">Guider</option>
  </select>
  <button type="button" data-device="desktop" aria-pressed="true">PC</button>
  <button type="button" data-device="tablet" aria-pressed="false">Nettbrett</button>
  <button type="button" data-device="mobile" aria-pressed="false">Mobil</button>
  <button id="preview-reload" type="button">↻ Oppdater utkast</button>
  <button id="preview-fullscreen" type="button" aria-pressed="false" title="Bruk hele skjermen">⛶ Fullskjerm</button>
  <button id="preview-close" type="button">Lukk</button>
 </div>
</header>
<div class="subbar"><span id="preview-state" role="status" aria-live="polite">Venter på utkast fra Studio …</span><span>Naviger og klikk i nettsiden som en besøkende. Ingenting publiseres herfra.</span></div>
<div class="stage desktop" id="stage"><iframe id="site-frame" title="Fullstendig nettside med endringene dine" src="./index.html#topp"></iframe></div>
<script>
(()=>{
'use strict';
const origin=location.origin,frame=document.getElementById('site-frame'),status=document.getElementById('preview-state');
let config=null,version='',currentSection='topp';
function receive(){
 if(!window.opener||window.opener.closed){status.textContent='Åpne forhåndsvisningen fra innlogget Lånesjekk Studio.';status.dataset.error='true';return}
 window.opener.postMessage({type:'lanesjekk-studio-preview-ready'},origin);
}
function apply(){
 if(!config||!frame.contentWindow)return;
 frame.contentWindow.postMessage({type:'lanesjekk-cms-preview',config},origin);
 status.textContent='Utkast oppdatert'+(version?' · '+version:'')+' · ikke publisert';
 status.dataset.error='false';
}
window.addEventListener('message',event=>{
 if(event.origin!==origin||event.source!==window.opener||event.data?.type!=='lanesjekk-studio-preview-data')return;
 if(!event.data.config||typeof event.data.config!=='object')return;
 config=event.data.config;
 version=String(event.data.version||'');
 if(event.data.section&&document.querySelector('#preview-section option[value="'+event.data.section+'"]'))currentSection=event.data.section;
 document.getElementById('preview-section').value=currentSection;
 const desired='#'+currentSection;
 if(frame.contentWindow&&frame.contentWindow.location.hash!==desired)frame.contentWindow.location.hash=desired;
 apply();
});
frame.addEventListener('load',apply);
document.getElementById('preview-reload').addEventListener('click',receive);
document.getElementById('preview-close').addEventListener('click',()=>window.close());
const fullscreenButton=document.getElementById('preview-fullscreen');
fullscreenButton.addEventListener('click',async()=>{
 try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}
 catch{status.textContent='Nettleseren tillot ikke fullskjerm. Bruk vinduets maksimer-knapp.';status.dataset.error='true'}
});
document.addEventListener('fullscreenchange',()=>{
 const full=!!document.fullscreenElement;
 fullscreenButton.textContent=full?'⛶ Avslutt fullskjerm (Esc)':'⛶ Fullskjerm';
 fullscreenButton.setAttribute('aria-pressed',String(full));
});
document.getElementById('preview-section').addEventListener('change',e=>{
 currentSection=e.target.value;
 if(frame.contentWindow)frame.contentWindow.location.hash='#'+currentSection;
});
document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{
 document.getElementById('stage').className='stage '+button.dataset.device;
 document.querySelectorAll('[data-device]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
}));
receive();
})();
</script>
</body></html>
